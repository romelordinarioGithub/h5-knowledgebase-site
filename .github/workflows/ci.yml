name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, unit test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Report bundle sizes
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const zlib = require('zlib');
          const dist = path.join('apps/web/dist/assets');
          const files = fs.readdirSync(dist).filter((f) => /\.(js|css)$/.test(f));
          let jsGzip = 0;
          let cssGzip = 0;
          for (const file of files) {
            const buf = fs.readFileSync(path.join(dist, file));
            const gzip = zlib.gzipSync(buf).length;
            const kb = (gzip / 1024).toFixed(2);
            console.log(`${file}: ${(buf.length / 1024).toFixed(2)} KB raw, ${kb} KB gzip`);
            if (file.endsWith('.js')) jsGzip += gzip;
            if (file.endsWith('.css')) cssGzip += gzip;
          }
          const totalAppGzipKb = (jsGzip + cssGzip) / 1024;
          console.log(`\nApp JS+CSS gzip (excl. fonts): ${totalAppGzipKb.toFixed(2)} KB`);
          if (totalAppGzipKb > 300) {
            console.error('Bundle exceeds 300KB gzip target (excl. fonts)');
            process.exit(1);
          }
          EOF

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: lint-test-build
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
